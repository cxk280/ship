version: 2.1

# CI + CD for Ship (the FleetGraph agent runs in-process inside the Ship API, so each Railway deploy
# ships both the app and the agent).
# Required CircleCI project/env vars:
#   RAILWAY_TOKEN_DEV, RAILWAY_TOKEN_STAGING, RAILWAY_TOKEN_PRODUCTION (Railway project tokens
#   are scoped to one environment); ANTHROPIC_API_KEY, LANGCHAIN_API_KEY, LANGCHAIN_TRACING_V2,
#   LANGCHAIN_PROJECT (optional — let the LLM evals run instead of skip).
# Railway environments:
#   dev: auto-deploys from master after CI is green.
#   staging: manual approval after dev deploy.
#   production: manual approval after staging deploy.

commands:
  setup_node:
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@10.27.0
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Build shared + sdk (api resolves @ship/shared and @ship/sdk at runtime/test)
          command: pnpm build:shared && pnpm --filter @ship/sdk build

jobs:
  install_build:
    docker:
      - image: cimg/node:20.18
    steps:
      - setup_node
      - run:
          name: Type-check
          command: pnpm type-check
      - run:
          name: Build (shared + api + web — catches deploy-breaking build errors)
          command: pnpm build

  eval_deterministic:
    docker:
      - image: cimg/node:20.18
    steps:
      - setup_node
      - run:
          name: Layer 1 — detector + dedup/suppression evals
          command: pnpm --filter @ship/api fleetgraph:eval

  test_integration:
    docker:
      - image: cimg/node:20.18
        environment:
          NODE_ENV: test
          FLEETGRAPH_DISABLE_LLM: "1"
          # Tests run the graph (incl. runDigest) with the LLM disabled; keep their traces out
          # of LangSmith so the fleetgraph project isn't polluted with CI noise.
          LANGCHAIN_TRACING_V2: "false"
          DATABASE_URL: postgresql://postgres@localhost:5432/ship_test
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: ship_test
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - setup_node
      - run:
          name: Wait for Postgres
          command: for i in $(seq 1 30); do (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && exit 0; sleep 1; done; echo "postgres not ready"; exit 1
      - run:
          name: Run migrations (replay-safe)
          command: pnpm --filter @ship/api db:migrate
      - run:
          name: Layer 2 — graph-path + HITL integration tests (+ existing suite)
          command: pnpm --filter @ship/api test

  eval_llm:
    docker:
      - image: cimg/node:20.18
    steps:
      - setup_node
      - run:
          name: Layers 3+4 — LLM-graded + adversarial evals (LangSmith)
          command: pnpm --filter @ship/api fleetgraph:eval:llm

  deploy_railway:
    parameters:
      railway_environment:
        type: string
      railway_token_env:
        type: env_var_name
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install Railway CLI
          command: sudo npm i -g @railway/cli
      - run:
          name: Deploy app + agent to Railway << parameters.railway_environment >>
          command: >
            RAILWAY_TOKEN="${<< parameters.railway_token_env >>:?Set << parameters.railway_token_env >> in CircleCI project environment variables}"
            railway up
            --project 904aa42d-be5e-449e-8b8f-ce7f6bf1805c
            --service shipshape-app
            --environment << parameters.railway_environment >>
            --ci

workflows:
  build-test-deploy:
    jobs:
      - install_build
      - eval_deterministic:
          requires: [install_build]
      - test_integration:
          requires: [install_build]
      - eval_llm:
          requires: [install_build]
      - deploy_railway:
          name: deploy_dev
          railway_environment: dev
          railway_token_env: RAILWAY_TOKEN_DEV
          requires: [install_build, eval_deterministic, test_integration, eval_llm]
          filters:
            branches:
              only: master
      - hold_staging:
          type: approval
          requires: [deploy_dev]
          filters:
            branches:
              only: master
      - deploy_railway:
          name: deploy_staging
          railway_environment: staging
          railway_token_env: RAILWAY_TOKEN_STAGING
          requires: [hold_staging]
          filters:
            branches:
              only: master
      - hold_prod:
          type: approval
          requires: [deploy_staging]
          filters:
            branches:
              only: master
      - deploy_railway:
          name: deploy_prod
          railway_environment: production
          railway_token_env: RAILWAY_TOKEN_PRODUCTION
          requires: [hold_prod]
          filters:
            branches:
              only: master
