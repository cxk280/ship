version: 2.1

# CI + CD for Ship (the FleetGraph agent runs in-process inside the Ship API, so each Railway deploy
# ships both the app and the agent).
# Required CircleCI project/env vars:
#   RAILWAY_TOKEN_DEV, RAILWAY_TOKEN_STAGING, RAILWAY_TOKEN_PRODUCTION (Railway project tokens
#   are scoped to one environment); ANTHROPIC_API_KEY, LANGCHAIN_API_KEY, LANGCHAIN_TRACING_V2,
#   LANGCHAIN_PROJECT (optional — let the LLM evals run instead of skip).
# Railway environments:
#   dev: auto-deploys from master after CI is green.
#   staging: manual approval after dev deploy.
#   production: manual approval after staging deploy.

commands:
  setup_node:
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@10.27.0
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Build shared + sdk (api resolves @ship/shared and @ship/sdk at runtime/test)
          command: pnpm build:shared && pnpm --filter @ship/sdk build

jobs:
  install_build:
    docker:
      - image: cimg/node:20.18
    steps:
      - setup_node
      - run:
          name: Type-check
          command: pnpm type-check
      - run:
          name: Build (shared + api + web — catches deploy-breaking build errors)
          command: pnpm build

  eval_deterministic:
    docker:
      - image: cimg/node:20.18
    steps:
      - setup_node
      - run:
          name: Layer 1 — detector + dedup/suppression evals
          command: pnpm --filter @ship/api fleetgraph:eval

  test_integration:
    docker:
      - image: cimg/node:20.18
        environment:
          NODE_ENV: test
          FLEETGRAPH_DISABLE_LLM: "1"
          # Tests run the graph (incl. runDigest) with the LLM disabled; keep their traces out
          # of LangSmith so the fleetgraph project isn't polluted with CI noise.
          LANGCHAIN_TRACING_V2: "false"
          DATABASE_URL: postgresql://postgres@localhost:5432/ship_test
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: ship_test
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - setup_node
      - run:
          name: Wait for Postgres
          command: for i in $(seq 1 30); do (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && exit 0; sleep 1; done; echo "postgres not ready"; exit 1
      - run:
          name: Run migrations (replay-safe)
          command: pnpm --filter @ship/api db:migrate
      - run:
          name: Layer 2 — graph-path + HITL integration tests (+ existing suite)
          command: pnpm --filter @ship/api test

  eval_llm:
    docker:
      - image: cimg/node:20.18
    steps:
      - setup_node
      - run:
          name: Layers 3+4 — LLM-graded + adversarial evals (LangSmith)
          command: pnpm --filter @ship/api fleetgraph:eval:llm

  ttfe_drill:
    # Signature challenge: on every PR, run the full Time-to-First-Event loop
    # end-to-end against a real Ship instance — device login → subscribe →
    # create document → receive a SIGNED webhook → verify the signature — and
    # fail the build if it regresses past the drill's internal threshold (<60s).
    docker:
      - image: cimg/node:20.18
        environment:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres@localhost:5432/ship_test
          PORT: "3000"
          SHIP_BASE_URL: http://localhost:3000
          SHIP_CLIENT_ID: ship_app_cli
          FLEETGRAPH_DISABLE_LLM: "1"
          LANGCHAIN_TRACING_V2: "false"
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: ship_test
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - setup_node
      - run:
          name: Wait for Postgres
          command: for i in $(seq 1 30); do (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && exit 0; sleep 1; done; echo "postgres not ready"; exit 1
      - run:
          name: Migrate (creates platform schema + seeds ship_app_cli) and seed the drill user
          command: |
            pnpm --filter @ship/api db:migrate
            pnpm --filter @ship/api db:seed
      - run:
          name: Build the API (the drill runs against the built server)
          command: pnpm --filter @ship/api build
      - run:
          name: Start Ship API
          command: node api/dist/index.js
          background: true
      - run:
          name: Wait for API health
          command: for i in $(seq 1 60); do curl -sf http://localhost:3000/health >/dev/null 2>&1 && exit 0; sleep 1; done; echo "API not ready"; cat /tmp/api.log 2>/dev/null; exit 1
      - run:
          name: Time-to-First-Event drill (login → create document → verified signed webhook)
          command: pnpm drill:ttfe
      - store_artifacts:
          # Persist the measured timing (ms, per-step breakdown, pass/fail) as a
          # build artifact so the TTFE trend is browsable from the CircleCI UI.
          path: test-results/ttfe.json
          destination: ttfe.json
      - run:
          name: Post/update TTFE trend PR comment (PR builds only; degrades to print-only without a token)
          when: always
          command: bash scripts/ttfe-pr-comment.sh
      - run:
          name: Refresh README TTFE badge from the measurement (master only)
          when: always
          command: |
            if [ "${CIRCLE_BRANCH:-}" = "master" ]; then
              node scripts/ttfe-badge.mjs
              # CI does not git-push the badge here; the committed docs/ttfe-badge.json
              # is the source of truth. This regenerates + diffs it for visibility.
              git --no-pager diff -- docs/ttfe-badge.json || true
            else
              echo "Not master — skipping badge refresh."
            fi

  perf_regression:
    # PRD perf budget: per-route query counts and SDK install size must stay
    # within the documented limits (+10% of the Part-1 baseline / <250KB). Each
    # gate exits non-zero on regression, failing the build.
    docker:
      - image: cimg/node:20.18
        environment:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres@localhost:5432/ship_test
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: ship_test
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - setup_node
      - run:
          name: Wait for Postgres
          command: for i in $(seq 1 30); do (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && exit 0; sleep 1; done; echo "postgres not ready"; exit 1
      - run:
          name: Migrate + seed (query-count flow logs in as the seeded user)
          command: |
            pnpm --filter @ship/api db:migrate
            pnpm --filter @ship/api db:seed
      - run:
          name: Per-route query-count budget (+10% of baseline)
          command: pnpm --filter @ship/api exec tsx "$(pwd)/scripts/shipshape-query-count.ts"
      - run:
          name: SDK install-size budget (<250 KB gzipped, zero runtime deps)
          command: node scripts/check-sdk-bundle-size.mjs

  openapi_breaking:
    # Contract gate: regenerate the /api/v1 OpenAPI spec and diff it against
    # origin/master using oasdiff.  Fails the build if any breaking change is
    # detected, enforcing the Plugforge versioning policy (additive-only within
    # /v1; breaking changes must go to /v2).
    #
    # oasdiff is a Go binary fetched at runtime — no npm dependency added.
    # If origin/master has no docs/openapi.json yet (first-ever spec), the
    # script skips the diff and exits 0 (no-baseline pass).
    docker:
      - image: cimg/node:20.18
        environment:
          BASE_BRANCH: master
    steps:
      - setup_node
      - run:
          name: OpenAPI breaking-change gate (oasdiff vs origin/master)
          command: bash scripts/openapi-breaking-check.sh

  test_e2e:
    # Enforced E2E quality gate: the full Playwright suite runs the real built
    # app (API + Vite preview) against a per-worker PostgreSQL container and must
    # pass before any deploy. Runs on the `machine` executor (not `docker`)
    # because the suite uses testcontainers — those need a local Docker daemon
    # on localhost, which setup_remote_docker (remote host) cannot provide.
    machine:
      image: ubuntu-2204:2024.05.1
    resource_class: large
    environment:
      NODE_ENV: test
      # The machine has 4 vCPU / 15 GB; cap workers so the per-worker stack
      # (Postgres container + API + vite preview + Chromium) stays well within RAM.
      PLAYWRIGHT_WORKERS: "2"
    steps:
      - checkout
      - run:
          name: Use Node 20 (persist across steps via $BASH_ENV)
          command: |
            # CircleCI machine images ship nvm under /opt/circleci/.nvm — NOT
            # $HOME/.nvm. Detect the real dir so every later step's $BASH_ENV
            # sources the same nvm the install used.
            NVM_DIR="${NVM_DIR:-/opt/circleci/.nvm}"
            [ -s "$NVM_DIR/nvm.sh" ] || NVM_DIR="$HOME/.nvm"
            export NVM_DIR
            . "$NVM_DIR/nvm.sh"
            nvm install 20.18
            nvm alias default 20.18
            {
              echo "export NVM_DIR=\"$NVM_DIR\""
              echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"'
              echo 'nvm use 20.18 >/dev/null'
            } >> "$BASH_ENV"
      - run:
          name: Install pnpm
          command: npm install -g pnpm@10.27.0
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Build shared + sdk (api/web resolve @ship/shared and @ship/sdk)
          command: pnpm build:shared && pnpm --filter @ship/sdk build
      - run:
          name: Make apt non-interactive (suppress needrestart service-restart prompt)
          # `playwright install --with-deps` runs `sudo apt-get`, which on the
          # ubuntu-2204 machine image triggers needrestart's interactive whiptail
          # "Which services should be restarted?" dialog. With no TTY to answer,
          # the step hangs until CircleCI's 10-minute no-output timeout kills it
          # (the suite never even starts). Force needrestart to auto-restart and
          # apt to noninteractive so the install runs unattended.
          command: |
            sudo mkdir -p /etc/needrestart/conf.d
            printf '$nrconf{restart} = "a";\n$nrconf{kernelhints} = 0;\n' | sudo tee /etc/needrestart/conf.d/99-ci.conf >/dev/null
            {
              echo 'export DEBIAN_FRONTEND=noninteractive'
              echo 'export NEEDRESTART_MODE=a'
              echo 'export NEEDRESTART_SUSPEND=1'
            } >> "$BASH_ENV"
      - restore_cache:
          keys:
            - playwright-browsers-v1-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install Playwright Chromium + OS deps
          command: pnpm exec playwright install --with-deps chromium
      - save_cache:
          key: playwright-browsers-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/ms-playwright
      - run:
          name: End-to-end tests (Playwright — built app + per-worker Postgres container)
          # global-setup builds api + web once; each worker spins its own
          # testcontainers Postgres, API server, and vite preview. forbidOnly +
          # 2 retries are already set for CI in playwright.config.ts.
          command: pnpm test:e2e
      # `when: always` is ESSENTIAL: a failing `pnpm test:e2e` exits non-zero, and
      # without it CircleCI skips these steps — so on the exact runs we most need
      # diagnostics (red suite), we'd capture none. With it, the JUnit + HTML
      # report + traces are always uploaded.
      - store_test_results:
          # JUnit XML (emitted only in CI) drives CircleCI's test-results tab so
          # individual E2E failures are visible without opening artifacts.
          path: test-results/junit.xml
          when: always
      - store_artifacts:
          path: playwright-report
          destination: playwright-report
          when: always
      - store_artifacts:
          path: test-results
          destination: e2e-test-results
          when: always

  deploy_railway:
    parameters:
      railway_environment:
        type: string
      railway_token_env:
        type: env_var_name
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install Railway CLI
          command: sudo npm i -g @railway/cli
      - run:
          name: Deploy app + agent to Railway << parameters.railway_environment >>
          command: >
            RAILWAY_TOKEN="${<< parameters.railway_token_env >>:?Set << parameters.railway_token_env >> in CircleCI project environment variables}"
            railway up
            --project 904aa42d-be5e-449e-8b8f-ce7f6bf1805c
            --service shipshape-app
            --environment << parameters.railway_environment >>
            --ci

workflows:
  build-test-deploy:
    jobs:
      - install_build
      - eval_deterministic:
          requires: [install_build]
      - test_integration:
          requires: [install_build]
      - eval_llm:
          requires: [install_build]
      - ttfe_drill:
          requires: [install_build]
      - perf_regression:
          requires: [install_build]
      - openapi_breaking:
          requires: [install_build]
      - test_e2e:
          requires: [install_build]
      - deploy_railway:
          name: deploy_dev
          railway_environment: dev
          railway_token_env: RAILWAY_TOKEN_DEV
          # Deploy gates on the DETERMINISTIC build/test/platform jobs only. The LLM
          # evals (eval_llm) are non-deterministic and depend on external Anthropic
          # credits + LangSmith quota — gating deploys on them means "no credits = no
          # deploys", which had silently blocked every deploy. The platform does zero
          # AI work, so its deploy must not hinge on the agent's eval credits. eval_llm
          # still runs as an informational signal.
          requires: [install_build, eval_deterministic, test_integration, ttfe_drill, perf_regression, openapi_breaking, test_e2e]
          filters:
            branches:
              only: master
      - hold_staging:
          type: approval
          requires: [deploy_dev]
          filters:
            branches:
              only: master
      - deploy_railway:
          name: deploy_staging
          railway_environment: staging
          railway_token_env: RAILWAY_TOKEN_STAGING
          requires: [hold_staging]
          filters:
            branches:
              only: master
      - hold_prod:
          type: approval
          requires: [deploy_staging]
          filters:
            branches:
              only: master
      - deploy_railway:
          name: deploy_prod
          railway_environment: production
          railway_token_env: RAILWAY_TOKEN_PRODUCTION
          requires: [hold_prod]
          filters:
            branches:
              only: master
