name: Request Codex Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  request-review:
    name: Ask Codex to review PR changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Comment with Codex review request
        uses: actions/github-script@v7
        with:
          script: |
            const action = context.payload.action;
            const sha = context.payload.pull_request.head.sha;
            const marker = `<!-- codex-review-request:${sha} -->`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info(`Codex review was already requested for ${sha}`);
              return;
            }

            const reason =
              action === 'synchronize'
                ? 'The pull request branch was updated, so please review the latest changes.'
                : 'A pull request is ready for review.';

            const body = [
              marker,
              '@codex review',
              '',
              reason,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
