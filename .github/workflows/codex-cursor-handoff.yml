name: Codex Cursor Handoff

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  notify-cursor:
    name: Notify Cursor when Codex requests changes
    runs-on: ubuntu-latest
    if: >
      github.event.review.state == 'changes_requested' &&
      (
        contains(github.event.review.user.login, 'codex') ||
        contains(github.event.review.user.login, 'openai')
      )
    steps:
      - name: Comment with Cursor handoff from connected GitHub user
        env:
          GH_TOKEN: ${{ secrets.CURSOR_TRIGGER_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "CURSOR_TRIGGER_GITHUB_TOKEN is required so Cursor sees the trigger as a real connected user, not github-actions[bot]." >&2
            exit 1
          fi

          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "@cursor fix the Codex review comments"
