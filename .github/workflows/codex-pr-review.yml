name: Codex PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review with Codex
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request refs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: "cursor[bot]"
          sandbox: read-only
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "decision": {
                  "type": "string",
                  "enum": ["APPROVE", "REQUEST_CHANGES"]
                },
                "summary": {
                  "type": "string"
                },
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "severity": {
                        "type": "string",
                        "enum": ["blocking", "non_blocking"]
                      },
                      "file": {
                        "type": "string"
                      },
                      "line": {
                        "type": "integer"
                      },
                      "message": {
                        "type": "string"
                      }
                    },
                    "required": ["severity", "file", "line", "message"]
                  }
                }
              },
              "required": ["decision", "summary", "findings"]
            }
          prompt: |
            You are Codex reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Review only the changes introduced by this pull request.

            Base SHA: ${{ github.event.pull_request.base.sha }}
            Head SHA: ${{ github.event.pull_request.head.sha }}
            Base branch: ${{ github.event.pull_request.base.ref }}
            Head branch: ${{ github.event.pull_request.head.ref }}

            Use git commands such as:
            - git diff --stat ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            - git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Return REQUEST_CHANGES only for blocking issues: correctness bugs, security issues, regressions, broken CI/deploy behavior, or missing tests for risky changes.
            Return APPROVE when there are no blocking issues. Non-blocking suggestions can be included in findings with severity "non_blocking".

            Pull request title:
            ${{ github.event.pull_request.title }}

            Pull request body:
            ${{ github.event.pull_request.body }}

      - name: Submit GitHub review
        uses: actions/github-script@v7
        env:
          CODEX_RESULT: ${{ steps.codex.outputs.final-message }}
        with:
          script: |
            const raw = process.env.CODEX_RESULT || '';
            const jsonText = raw
              .replace(/^```(?:json)?\s*/i, '')
              .replace(/\s*```$/i, '')
              .trim();

            let result;
            try {
              result = JSON.parse(jsonText);
            } catch (error) {
              result = {
                decision: 'REQUEST_CHANGES',
                summary: `Codex returned output that could not be parsed as review JSON: ${error.message}`,
                findings: [{
                  severity: 'blocking',
                  file: 'Codex PR Review',
                  line: 1,
                  message: raw.slice(0, 4000) || 'No Codex output was returned.',
                }],
              };
            }

            const blockingFindings = Array.isArray(result.findings)
              ? result.findings.filter((finding) => finding.severity === 'blocking')
              : [];

            const event = result.decision === 'APPROVE' && blockingFindings.length === 0
              ? 'APPROVE'
              : 'REQUEST_CHANGES';

            const findings = Array.isArray(result.findings) ? result.findings : [];
            const findingText = findings.length === 0
              ? 'No findings.'
              : findings.map((finding) => {
                  const location = finding.file && Number.isInteger(finding.line)
                    ? `${finding.file}:${finding.line}`
                    : finding.file || 'unknown location';
                  return `- ${finding.severity}: ${location} - ${finding.message}`;
                }).join('\n');

            const body = [
              '<!-- codex-action-review -->',
              `Codex decision: ${event}`,
              '',
              result.summary || 'No summary provided.',
              '',
              findingText,
            ].join('\n');

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event,
              body,
            });

            if (event === 'REQUEST_CHANGES') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: [
                  '@cursor fix the Codex review comments',
                  '',
                  'Triggered because Codex requested changes.',
                ].join('\n'),
              });
            }
