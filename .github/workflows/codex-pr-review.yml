name: Codex PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review with Codex
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request refs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Skip re-review when a push adds no new code (e.g. "Update branch")
        id: changecheck
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          skip=false
          # Only a synchronize (new push) can be a no-op base merge; opened /
          # reopened / ready_for_review always review.
          if [ "$ACTION" = "synchronize" ] && [ -n "${BEFORE:-}" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "$BASE_SHA" "$BEFORE" "$AFTER" 2>/dev/null || true
            # New NON-merge commits this push added that are NOT already on base.
            # Clicking "Update branch" merely merges base in, so this set is empty →
            # nothing reviewable changed → skip the (paid) Codex round. Real code
            # pushes add author commits not on base → non-empty → review.
            new=$(git rev-list --no-merges "${BEFORE}..${AFTER}" "^${BASE_SHA}" 2>/dev/null | head -1 || true)
            [ -z "$new" ] && skip=true
          fi
          echo "skip=$skip" | tee -a "$GITHUB_OUTPUT"

      - name: Run Codex review
        id: codex
        if: steps.changecheck.outputs.skip != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          # Allow the Cursor fix bot's pushes to be reviewed. Without this, the
          # action's check-write-access rejects 'cursor[bot]' (permission: none)
          # and the run CRASHES before posting a verdict — pinning the PR at the
          # last REQUEST_CHANGES forever (the auto-review loop never converges).
          allow-bot-users: "cursor[bot]"
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "decision": {
                  "type": "string",
                  "enum": ["APPROVE", "REQUEST_CHANGES"]
                },
                "summary": {
                  "type": "string"
                },
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "severity": {
                        "type": "string",
                        "enum": ["blocking", "non_blocking"]
                      },
                      "file": {
                        "type": "string"
                      },
                      "line": {
                        "type": "integer"
                      },
                      "message": {
                        "type": "string"
                      }
                    },
                    "required": ["severity", "file", "line", "message"]
                  }
                }
              },
              "required": ["decision", "summary", "findings"]
            }
          prompt: |
            You are Codex reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Review only the changes introduced by this pull request.

            Base SHA: ${{ github.event.pull_request.base.sha }}
            Head SHA: ${{ github.event.pull_request.head.sha }}
            Base branch: ${{ github.event.pull_request.base.ref }}
            Head branch: ${{ github.event.pull_request.head.ref }}

            Use git commands such as:
            - git diff --stat ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            - git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Return REQUEST_CHANGES only for blocking issues: correctness bugs, security issues, regressions, broken CI/deploy behavior, or missing tests for risky changes.
            Return APPROVE when there are no blocking issues. Non-blocking suggestions can be included in findings with severity "non_blocking".

            Pull request title:
            ${{ github.event.pull_request.title }}

            Pull request body:
            ${{ github.event.pull_request.body }}

      - name: Submit GitHub review
        id: submit_review
        if: steps.changecheck.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          CODEX_RESULT: ${{ steps.codex.outputs.final-message }}
        with:
          script: |
            const raw = process.env.CODEX_RESULT || '';
            const jsonText = raw
              .replace(/^```(?:json)?\s*/i, '')
              .replace(/\s*```$/i, '')
              .trim();

            let result;
            try {
              result = JSON.parse(jsonText);
            } catch (error) {
              // FAIL OPEN: a parse/transport error in the reviewer itself must not
              // auto-block the PR (and must not trigger the Cursor fix loop). Post a
              // non-blocking COMMENT and exit — humans still review.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: [
                  '<!-- codex-action-review -->',
                  '⚠️ Codex review could not be parsed (transient reviewer error); not blocking.',
                  '',
                  `Parse error: ${error.message}`,
                ].join('\n'),
              });
              core.setOutput('event', 'COMMENT');
              return;
            }

            const blockingFindings = Array.isArray(result.findings)
              ? result.findings.filter((finding) => finding.severity === 'blocking')
              : [];

            const event = result.decision === 'APPROVE' && blockingFindings.length === 0
              ? 'APPROVE'
              : 'REQUEST_CHANGES';

            const findings = Array.isArray(result.findings) ? result.findings : [];
            const findingText = findings.length === 0
              ? 'No findings.'
              : findings.map((finding) => {
                  const location = finding.file && Number.isInteger(finding.line)
                    ? `${finding.file}:${finding.line}`
                    : finding.file || 'unknown location';
                  return `- ${finding.severity}: ${location} - ${finding.message}`;
                }).join('\n');

            const body = [
              '<!-- codex-action-review -->',
              `Codex decision: ${event}`,
              '',
              result.summary || 'No summary provided.',
              '',
              findingText,
            ].join('\n');

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event,
              body,
            });

            core.setOutput('event', event);

      - name: Ping Cursor to auto-fix when changes are requested
        if: steps.submit_review.outputs.event == 'REQUEST_CHANGES'
        uses: actions/github-script@v7
        with:
          script: |
            // Post the "@cursor fix" ping INLINE from this same run.
            //
            // Why not a separate pull_request_review-triggered workflow (the old
            // codex-cursor-handoff.yml)? Codex's review is submitted with the default
            // GITHUB_TOKEN, and GitHub intentionally does NOT trigger downstream
            // workflows from GITHUB_TOKEN-generated events (loop prevention). So that
            // handoff workflow could never fire, and the ping was never sent. Cursor
            // is an EXTERNAL GitHub App, so it still receives this comment's webhook
            // and acts on the mention — pinging inline is reliable.
            const pr = context.payload.pull_request.number;
            const MAX_ROUNDS = 8;
            // Stop the loop once Cursor has already pushed MAX_ROUNDS fix commits.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
            });
            const cursorCommits = commits.filter(
              (c) =>
                /cursor/i.test(c.author?.login || '') ||
                /cursor/i.test(c.commit?.author?.name || ''),
            ).length;
            if (cursorCommits >= MAX_ROUNDS) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body: `⚠️ Cursor has already auto-fixed this PR ${cursorCommits} times (cap: ${MAX_ROUNDS}). Stopping the auto-fix loop — a human should review the remaining Codex findings.`,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: '@cursor fix the Codex review comments',
            });
